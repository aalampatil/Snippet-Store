name: Bug report
description: Report a reproducible problem in the app, API, or documentation.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting. For vulnerabilities, follow
        [SECURITY.md](https://github.com/aalampatil/Snippet-Store/blob/main/SECURITY.md)
        instead. Remove credentials, tokens, email addresses, and private snippets from attachments.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide numbered steps and a minimal example using test data.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Android app
        - iOS app
        - Web app
        - API or database
        - Documentation or setup
        - Unsure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Include the commit or app version, OS/device, Node.js version, and Expo client or browser where relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or additional context
      description: Include relevant errors or screenshots after removing sensitive information.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no secrets or private user data and is not a security vulnerability report.
          required: true
