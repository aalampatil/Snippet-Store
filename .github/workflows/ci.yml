name: Validate production build
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: snippetstore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d snippetstore_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/snippetstore_test
      - run: npm audit --omit=dev --audit-level=high
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snippetstore
    env:
      EXPO_PUBLIC_API_URL: https://api.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: snippetstore/package-lock.json
      - run: npm ci
      - run: npx expo customize tsconfig.json
      - run: npx tsc --noEmit
      - run: npm run test:dependencies
      - run: npx expo export --platform android --platform ios
